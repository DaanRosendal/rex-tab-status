name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the tag against both manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          for manifest in .claude-plugin/plugin.json codex/.codex-plugin/plugin.json; do
            found=$(node -p "require('./$manifest').version")
            if [ "$found" != "$version" ]; then
              echo "::error::$manifest is $found but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm test
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $1 == "##" && $2 == "[" v "]" { found = 1; next }
            $1 == "##" && found { exit }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
